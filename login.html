<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#eef1f3">
    <title>Entrar | Bosque da Fantasia</title>
    <link rel="stylesheet" href="./login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <div class="login-brand" aria-hidden="true">BF</div>
            <p class="eyebrow">Bosque da Fantasia</p>
            <h1 id="login-title">Bem-vindo de volta</h1>
            <p class="login-intro">Entre para continuar sua jornada pelo acervo.</p>

            <form id="login-form" class="login-form" novalidate>
                <div class="field-group">
                    <label for="email">E-mail</label>
                    <input
                        id="email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="voce@exemplo.com"
                        required
                    >
                </div>

                <div class="field-group">
                    <label for="password">Senha</label>
                    <input
                        id="password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Digite sua senha"
                        required
                    >
                </div>

                <button class="submit-button" type="submit">Entrar</button>
                <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <script type="module" src="./login.js?v=master-session-v2"></script>
</body>
</html>
